<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Redirecting...</title>
    <link rel="canonical" href="https://jae-heo.github.io/life/en/">
    <link rel="alternate" hreflang="en" href="https://jae-heo.github.io/life/en/">
    <link rel="alternate" hreflang="ko" href="https://jae-heo.github.io/life/ko/">
    <link rel="alternate" hreflang="x-default" href="https://jae-heo.github.io/life/en/">
    <script>
        // Get saved language preference or default
        const savedLang = localStorage.getItem('lang') || 'en';
        const supportedLangs = ["en","ko"];

        // Redirect to the appropriate language version
        const targetLang = supportedLangs.includes(savedLang) ? savedLang : 'en';
        window.location.replace(window.location.pathname + targetLang + '/');
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0; url=./en/">
    </noscript>
</head>
<body>
    <p>Redirecting to your preferred language...</p>
    <p>If you are not redirected: <a href="./en/">English</a> | <a href="./ko/">한국어</a></p>
</body>
</html>
